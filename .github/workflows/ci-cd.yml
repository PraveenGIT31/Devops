# ================================================
# .github/workflows/ci-cd.yml
# GitHub Actions — CI/CD Pipeline
# Triggers on push to main branch
# ================================================

name: 🚀 CI/CD Pipeline — Build & Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Environment variables — update DOCKER_USERNAME to your Docker Hub username
env:
  DOCKER_USERNAME: praveengit31
  IMAGE_NAME: devops-app

jobs:

  # ============================================
  # Job 1: Build & push Docker image
  # ============================================
  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (enables multi-platform builds)
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to Docker Hub
      # Secrets are set in GitHub repo: Settings → Secrets → Actions
      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Extract metadata for image tags
      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # Step 5: Build and push Docker image
      - name: 🏗️ Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers for faster builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 6: Print image digest
      - name: ✅ Image digest
        run: echo "Image pushed with digest ${{ steps.build-push.outputs.digest }}"

