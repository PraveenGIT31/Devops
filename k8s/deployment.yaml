# ================================================
# k8s/deployment.yaml
# Kubernetes Deployment for DevOps Journey app
# ================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
  namespace: default
  labels:
    app: devops-app
    version: "1.0.0"
spec:
  # Number of pod replicas for high availability
  replicas: 2

  # Pod selector
  selector:
    matchLabels:
      app: devops-app

  # Rolling update strategy — zero downtime deployments
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1         # Allow 1 extra pod during update
      maxUnavailable: 0   # Keep all pods running during update

  template:
    metadata:
      labels:
        app: devops-app
    spec:
      containers:
        - name: devops-app
          # LOCAL (Docker Desktop K8s): use devops-app:latest with imagePullPolicy: Never
          # PRODUCTION (Docker Hub):    use praveendockman/devops-app:latest with imagePullPolicy: Always
          image: devops-app:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 80
              protocol: TCP

          # Resource limits — prevents the container from hogging node resources
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"

          # Liveness probe — K8s restarts pod if it becomes unhealthy
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

          # Readiness probe — pod only receives traffic when ready
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
